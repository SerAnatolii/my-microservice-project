
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
grafana:
  service:
    type: LoadBalancer
  adminPassword: ""  # Буде встановлено через set
  persistence:
    enabled: true
    storageClassName: "ebs-sc"
    size: 10Gi